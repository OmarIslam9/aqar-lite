name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aqar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aqar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aqar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/aqar
      SECRET_KEY: ci-only-secret
      SEED_PASSWORD: Passw0rd!2026
      COOKIE_SECURE: "0"
      FLASK_APP: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrate and seed an empty database
        run: |
          flask db upgrade
          flask seed
      - name: App boots and answers
        run: |
          gunicorn -b 127.0.0.1:8000 "app:create_app()" &
          for i in $(seq 1 20); do
            curl -fs http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fs http://127.0.0.1:8000/healthz
          curl -fs -o /dev/null http://127.0.0.1:8000/login
      - name: Seed data is present
        run: |
          test "$(PGPASSWORD=postgres psql -h localhost -U postgres -d aqar -tAc 'select count(*) from users')" = "8"